services:
  - type: web
    name: sentinel-fraud-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python generate_data.py && python train_model.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: sentinel-fraud-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: sentinel-fraud-api
          property: host
